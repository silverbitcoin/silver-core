[package]
name = "silver-core"
version = "2.5.4"
edition = "2021"
rust-version = "1.90"
authors = ["SilverBitcoin Team <team@silverbitcoin.org>"]
license = "Apache-2.0"
repository = "https://github.com/silverbitcoin/silverbitcoin"
homepage = "https://silverbitcoin.org"
keywords = ["blockchain", "cryptocurrency", "quantum-resistant", "consensus"]
categories = ["cryptography", "network-programming"]
description = "Core types, traits, and primitives for SilverBitcoin 512-bit blockchain"

[features]
default = []
secure_input = []

[dependencies]
# Serialization (512-bit blockchain core)
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
bytes = "1.5"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"

# Async runtime
tokio = { version = "1.48", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Logging
silver-logging = { path = "../silver-logging" }

# Cryptography (512-bit only)
sha2 = "0.10"
p521 = "0.13"
pqcrypto-sphincsplus = "0.7"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7.3"
rand = { version = "0.8", features = ["std", "std_rng"] }

# HTTP/RPC Server (512-bit blockchain)
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
hyper = "1.4"

# Database (Real Blockchain Storage)
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }
parity-db = "0.4"
lru = "0.12"

[dev-dependencies]
proptest = "1.4"
pretty_assertions = "1.4"

[[bin]]
name = "wallet"
path = "src/bin/generate_cold_wallet.rs"
